@let selected = this.process();

<div class="flex-fixed">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Process list</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <mat-list>
                @for (process of this.list(); track process.id) {
                    @if ($index > 0) {
                        <mat-divider></mat-divider>
                    }

                    <mat-list-item>
                        <div class="mat-list-item-content">
                            <button mat-icon-button
                            (click)="this.onProcessClick(process)"
                            [disabled]="(
                                processLog.connecting() ||
                                processLog.reconnecting()
                            )">
                                @if (selected?.id === process.id) {
                                    <mat-icon>check_box</mat-icon>
                                } @else {
                                    <mat-icon>check_box_outline_blank</mat-icon>
                                }
                            </button>

                            <span>{{ process.name }}</span>
                        </div>
                    </mat-list-item>
                }
            </mat-list>
        </mat-card-content>
    </mat-card>
</div>

<app-process-log #processLog
[process]="selected">
</app-process-log>
